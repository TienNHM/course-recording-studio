<!doctype html>
<html lang="vi" data-palette="dotnet">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Course Recording Studio</title>
    <script>
      // Apply saved mode / palette / language before first paint (no flash).
      // Mirrors src/theme/preferences.ts (readPreferences + applyThemeToDocument).
      (function () {
        var root = document.documentElement;
        var prefs = {};
        try {
          prefs = JSON.parse(localStorage.getItem("crs:preferences") || "{}") || {};
        } catch (e) {}
        var mode = prefs.mode === "light" || prefs.mode === "dark" ? prefs.mode : null;
        if (!mode) {
          try {
            mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          } catch (e) {
            mode = "dark";
          }
        }
        var palettes = ["dotnet", "recorder", "ocean", "emerald", "slate"];
        var palette = palettes.indexOf(prefs.palette) >= 0 ? prefs.palette : "dotnet";
        root.classList.add(mode);
        root.setAttribute("data-palette", palette);
        root.lang = prefs.locale === "en" ? "en" : "vi";
        root.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--remotion-server-placeholder-->
  </body>
</html>
